<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Órdenes y operaciones · Ataskate Operativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/page.css" />
</head>
<body>
  <!-- Header · version=Op (Figma 3119:30385) -->
  <header class="ds-header">
    <div class="ds-header__brand">
      <button class="ds-profilebase ds-profilebase--ghost" type="button" aria-label="Abrir menú">
        <img src="assets/icons/hamburger.svg" width="24" height="24" alt="" />
      </button>
      <div class="ds-header__logo">
        <img src="assets/icons/logo-ataskate.svg" width="130" height="24" alt="ataskate" />
        <span class="ds-role-badge t-label-regular">Operativo</span>
      </div>
    </div>

    <form class="ds-search" role="search" style="flex:1 0 0" onsubmit="return false">
      <label class="sr-only" for="global-search">Buscar</label>
      <input id="global-search" class="ds-search__input" type="search" placeholder="Buscar" />
      <button class="ds-search__button" type="submit" aria-label="Buscar">
        <img src="assets/icons/search.svg" width="24" height="24" alt="" />
      </button>
    </form>

    <nav class="ds-header__ctas" aria-label="Acciones">
      <button class="ds-profilebase" type="button" aria-label="Notificaciones">
        <img src="assets/icons/notification.svg" width="24" height="24" alt="" />
      </button>
      <button class="ds-profilebase" type="button" aria-label="Sucursal">
        <img src="assets/icons/pos-terminal.svg" width="24" height="24" alt="" />
        <img class="ds-profilebase__status" src="assets/icons/status-dot.svg" width="12" height="12" alt="" />
      </button>
      <button class="ds-profilebase" type="button" aria-label="Configuración">
        <img src="assets/icons/settings.svg" width="24" height="24" alt="" />
      </button>
      <button class="ds-profilebase" type="button" aria-label="Carrito">
        <img src="assets/icons/cart.svg" width="24" height="24" alt="" />
        <span class="t-texto-bold">0</span>
      </button>
      <button class="ds-profilebase ds-profilebase--perfil" type="button" aria-label="Perfil">
        <span class="ds-avatar">RP</span>
        <img src="assets/icons/sync.svg" width="24" height="24" alt="" />
      </button>
    </nav>
  </header>

  <!-- Ordenes y operaciones nuevo (Figma 3396:2014) -->
  <main class="page">
    <div class="page__title-row">
      <h1 class="t-titulo-pagina page__title">Órdenes y operaciones</h1>
      <button class="ds-button t-boton" type="button" id="btn-exportar">
        <img src="assets/icons/export.svg" width="20" height="20" alt="" />
        Exportar
      </button>
    </div>

    <section class="ds-kpis" aria-label="Resumen" id="kpis"></section>

    <section class="ds-table-card" aria-label="Órdenes">
      <div class="ds-table-card__toolbar">
        <form class="ds-search ds-search--inside" role="search" onsubmit="return false">
          <label class="sr-only" for="orders-search">Buscar órdenes</label>
          <input id="orders-search" class="ds-search__input" type="search"
                 placeholder="Buscar por cliente, número de orden o canal de venta" />
          <button class="ds-search__button" type="submit" aria-label="Buscar">
            <img src="assets/icons/search.svg" width="24" height="24" alt="" />
          </button>
        </form>

        <div class="page__toolbar-right">
          <div class="ds-paginator" aria-label="Paginación">
            <div class="ds-paginator__group">
              <button class="ds-icon-button" type="button" data-page="first" aria-label="Primera página">
                <img src="assets/icons/page-first.svg" width="20" height="20" alt="" />
              </button>
              <button class="ds-icon-button ds-icon-button--tonal" type="button" data-page="prev" aria-label="Página anterior">
                <img src="assets/icons/page-prev.svg" width="20" height="20" alt="" />
              </button>
            </div>
            <p class="ds-paginator__label" id="paginator-label" aria-live="polite"></p>
            <div class="ds-paginator__group">
              <button class="ds-icon-button ds-icon-button--tonal" type="button" data-page="next" aria-label="Página siguiente">
                <img src="assets/icons/page-next.svg" width="20" height="20" alt="" />
              </button>
              <button class="ds-icon-button" type="button" data-page="last" aria-label="Última página">
                <img src="assets/icons/page-last.svg" width="20" height="20" alt="" />
              </button>
            </div>
          </div>
          <button class="ds-icon-button" type="button" id="btn-filtros" aria-label="Filtros">
            <img src="assets/icons/filter.svg" width="20" height="20" alt="" />
          </button>
        </div>
      </div>

      <div class="ds-table-card__filters">
        <div class="ds-chips" role="group" aria-label="Filtrar órdenes" id="chips"></div>
      </div>

      <div class="ds-table" role="table" aria-label="Lista de órdenes">
        <div class="ds-table__head" role="rowgroup">
          <div class="ds-table__row" role="row">
            <div class="ds-table__cell" role="columnheader">No. de orden</div>
            <div class="ds-table__cell" role="columnheader">Fecha de<br />la orden</div>
            <div class="ds-table__cell" role="columnheader">Cliente</div>
            <div class="ds-table__cell" role="columnheader">Tipo de<br />transacción</div>
            <div class="ds-table__cell" role="columnheader">Canal de venta</div>
            <div class="ds-table__cell" role="columnheader">Estado</div>
            <div class="ds-table__cell ds-table__cell--center" role="columnheader">Acciones pendientes</div>
            <div class="ds-table__cell ds-table__cell--right" role="columnheader">Total</div>
            <div role="columnheader" aria-hidden="true"></div>
          </div>
        </div>
        <div class="ds-table__body" role="rowgroup" id="orders-body"></div>
      </div>
    </section>
  </main>

  <!-- Tab Menu header (Figma 2514:11007) -->
  <footer class="ds-tab-menu">
    <div class="ds-tab-menu__tab">Ventana principal</div>
    <div class="ds-tab-menu__add">
      <button class="ds-icon-button ds-icon-button--sm" type="button" aria-label="Nueva ventana">
        <img src="assets/icons/add.svg" width="20" height="20" alt="" />
      </button>
    </div>
  </footer>

  <script src="scripts/data.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
